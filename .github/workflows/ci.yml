name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install serving and test dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install pytest==9.1.1 httpx

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q
