name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install serving and test dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install pytest==9.1.1 httpx

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Create untrained CI model bundle
        run: python scripts/create_ci_bundle.py

      - name: Build Docker image
        run: docker build -t sp500-api:ci .

      - name: Check both models in Docker
        shell: bash
        run: |
          set -euo pipefail
          for model in lstm transformer; do
            docker run -d --name sp500-api-ci -p 127.0.0.1:8000:8000 -e SP500_MODEL="$model" sp500-api:ci
            python scripts/check_ci_api.py --model "$model"
            healthy=false
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' sp500-api-ci)
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              docker logs sp500-api-ci
              exit 1
            fi
            docker rm -f sp500-api-ci
          done

      - name: Show container logs on failure
        if: failure()
        run: docker logs sp500-api-ci || true

      - name: Remove CI container
        if: always()
        run: docker rm -f sp500-api-ci || true
